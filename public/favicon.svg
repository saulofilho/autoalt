<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Sparkle & Eye Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple-Style Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Central Visual Symbol: Vision Lens / AI Sparkle -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Vision Ring -->
    <circle r="120" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="140 50" opacity="0.9" />

    <!-- Center AI Sparkle Star -->
    <path d="M 0 -75 Q 0 0 -75 0 Q 0 0 0 75 Q 0 0 75 0 Q 0 0 0 -75 Z" fill="url(#accentGrad)" />

    <!-- Core Pupil Light -->
    <circle r="18" fill="#ffffff" />
  </g>
</svg>
